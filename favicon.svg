<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NORLAB">
  <!-- Fondo blanco redondeado para mejor legibilidad en barras de pestañas -->
  <rect width="64" height="64" rx="12" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5" fill="none" stroke="#E5EAF0" stroke-width="1"/>

  <!-- Molécula NORLAB · simplificada para 64×64.
       Anillos (círculos huecos) conectados por líneas formando hexágono
       central con ramas. Color azul NORLAB #2A5870. -->
  <g stroke="#2A5870" stroke-width="2.4" fill="none" stroke-linecap="round">
    <!-- Hexágono central conectado por líneas -->
    <line x1="22" y1="22" x2="32" y2="20"/>
    <line x1="32" y1="20" x2="42" y2="22"/>
    <line x1="42" y1="22" x2="46" y2="32"/>
    <line x1="46" y1="32" x2="42" y2="42"/>
    <line x1="42" y1="42" x2="32" y2="44"/>
    <line x1="32" y1="44" x2="22" y2="42"/>
    <line x1="22" y1="42" x2="18" y2="32"/>
    <line x1="18" y1="32" x2="22" y2="22"/>

    <!-- Rama superior (la "C" + anillo) -->
    <line x1="32" y1="20" x2="32" y2="11"/>
    <line x1="32" y1="11" x2="26" y2="8"/>

    <!-- Rama izquierda inferior -->
    <line x1="18" y1="32" x2="10" y2="36"/>

    <!-- Rama derecha inferior -->
    <line x1="46" y1="32" x2="54" y2="36"/>

    <!-- Rama inferior central -->
    <line x1="32" y1="44" x2="32" y2="54"/>
    <line x1="32" y1="54" x2="40" y2="56"/>
  </g>

  <!-- Anillos (círculos con relleno blanco para que se vean huecos
       sobre el fondo blanco — el círculo solo es el contorno azul) -->
  <g stroke="#2A5870" stroke-width="2" fill="#FFFFFF">
    <circle cx="22" cy="22" r="3.2"/>
    <circle cx="32" cy="20" r="3.2"/>
    <circle cx="42" cy="22" r="3.2"/>
    <circle cx="46" cy="32" r="3.2"/>
    <circle cx="42" cy="42" r="3.2"/>
    <circle cx="32" cy="44" r="3.2"/>
    <circle cx="22" cy="42" r="3.2"/>
    <circle cx="18" cy="32" r="3.2"/>
    <circle cx="32" cy="11" r="2.6"/>
    <circle cx="10" cy="36" r="2.6"/>
    <circle cx="54" cy="36" r="2.6"/>
    <circle cx="32" cy="54" r="2.6"/>
    <circle cx="40" cy="56" r="2.2"/>
  </g>

  <!-- "C" pequeña arriba a la izquierda (acento del logo NORLAB) -->
  <path d="M 26 6 L 24 6 L 23 8 L 24 10 L 26 10" stroke="#2A5870" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
